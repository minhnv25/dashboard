<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điều hành chất lượng</title>
<meta name="description" content="Tải file Excel, CSV hoặc JSON lên: mỗi trang tính thành một mục điều hướng, mỗi mục có bộ lọc, chỉ số, biểu đồ và bảng dữ liệu.">
<meta name="theme-color" content="#0F5C56">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Layout: tablet and up = fixed nav column (one item per sheet) + wide content pane;
     phone = nav collapses to a scrolling tab strip above the content.
     Content pane: filter row (+ time at the end) -> 4 KPI tiles -> donut + column chart -> table. */
  :root {
    color-scheme: light;
    --bg: #F4F5F3;
    --surface: #FFFFFF;
    --sunken: #EFF1EF;
    --text: #14181C;
    --muted: #5B6570;
    --primary: #0F5C56;
    --primary-strong: #0B433F;
    --on-primary: #FFFFFF;
    --nav-bg: #0F5C56;
    --nav-text: #DCEBE8;
    --nav-hover: rgba(255,255,255,0.08);
    --nav-active: #FFFFFF;
    --nav-active-text: #0B433F;
    --accent: #C9860E;
    --border: #DEE3E1;
    --grid: #E8EBE9;
    --axis: #C3C9C6;
    --danger: #B0362E;
    --series: #0F5C56;
    --series-soft: rgba(15, 92, 86, 0.10);
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c-other: #A9ADA9;
    --shadow: 0 1px 2px rgba(20,24,28,0.05), 0 3px 10px rgba(20,24,28,0.05);
    --side-w: 232px;
    --font-display: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #10151A;
      --surface: #1A2129;
      --sunken: #141A20;
      --text: #EDEFEF;
      --muted: #9AA5AC;
      --primary: #3FA79B;
      --primary-strong: #55BDB1;
      --on-primary: #06201D;
      --nav-bg: #0B1F1D;
      --nav-text: #B9CFCB;
      --nav-hover: rgba(255,255,255,0.06);
      --nav-active: #3FA79B;
      --nav-active-text: #06201D;
      --accent: #E8A93D;
      --border: #2A333B;
      --grid: #232B33;
      --axis: #3A444D;
      --danger: #E5695F;
      --series: #3FA79B;
      --series-soft: rgba(63, 167, 155, 0.16);
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c-other: #5A6168;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #10151A;
    --surface: #1A2129;
    --sunken: #141A20;
    --text: #EDEFEF;
    --muted: #9AA5AC;
    --primary: #3FA79B;
    --primary-strong: #55BDB1;
    --on-primary: #06201D;
    --nav-bg: #0B1F1D;
    --nav-text: #B9CFCB;
    --nav-hover: rgba(255,255,255,0.06);
    --nav-active: #3FA79B;
    --nav-active-text: #06201D;
    --accent: #E8A93D;
    --border: #2A333B;
    --grid: #232B33;
    --axis: #3A444D;
    --danger: #E5695F;
    --series: #3FA79B;
    --series-soft: rgba(63, 167, 155, 0.16);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c-other: #5A6168;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
  .side {
    background: var(--nav-bg);
    color: var(--nav-text);
    display: grid;
    gap: 10px;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
    min-width: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: #FFFFFF; }
  .brand-mark {
    width: 30px; height: 30px; flex: none;
    border-radius: 7px;
    background: #FFFFFF;
    display: grid; place-items: center;
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 21px;
    line-height: 1.15;
    text-wrap: balance;
  }
  .nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 2px 4px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-item {
    all: unset;
    box-sizing: border-box;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px;
    border-radius: 8px;
    white-space: nowrap;
    font-weight: 500;
    font-size: 14.5px;
    color: var(--nav-text);
  }
  .nav-item:hover { background: var(--nav-hover); color: #FFFFFF; }
  .nav-item:focus-visible { outline: 2px solid #FFFFFF; outline-offset: 1px; }
  .nav-item[aria-current="page"] { background: var(--nav-active); color: var(--nav-active-text); font-weight: 600; }
  .nav-item .nav-caret { font-size: 11px; opacity: 0.7; }
  .nav-count {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 11.5px;
    opacity: 0.75;
    font-variant-numeric: tabular-nums;
  }
  .source {
    display: grid;
    gap: 6px;
    font-size: 13px;
    border-top: 1px solid rgba(255,255,255,0.14);
    padding-top: 10px;
  }
  .source-name { color: #FFFFFF; font-weight: 600; overflow-wrap: anywhere; line-height: 1.35; }
  .source-meta { opacity: 0.8; line-height: 1.4; }
  .source-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .side .btn { border-color: rgba(255,255,255,0.25); background: transparent; color: #FFFFFF; }
  .side .btn:hover { background: var(--nav-hover); }
  .side .btn-primary { background: #FFFFFF; color: #0B433F; border-color: #FFFFFF; }
  .side .btn-primary:hover { background: #E6F0EE; }
  .source-hint { margin: 0; opacity: 0.7; font-size: 12px; line-height: 1.4; }
  @media (max-width: 767px) {
    .source { grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 12px; }
    .source > * { grid-column: 1; }
    .source .source-actions { grid-column: 2; grid-row: 1 / span 3; }
    .source-hint { display: none; }
  }
  .chip-sample {
    justify-self: start;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    color: #F2C46B;
    border: 1px solid currentColor;
  }

  @media (min-width: 768px) {
    .shell {
      grid-template-columns: var(--side-w) minmax(0, 1fr);
      background: linear-gradient(to right, var(--nav-bg) var(--side-w), var(--bg) var(--side-w));
    }
    .side {
      position: sticky; top: 0;
      height: 100vh;
      overflow-y: auto;
      align-content: start;
      grid-template-rows: auto 1fr auto;
      padding: calc(18px + env(safe-area-inset-top, 0px)) 14px calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 18px;
    }
    .nav { flex-direction: column; overflow: visible; margin: 0 -4px; align-content: start; }
    .nav-item { padding: 9px 12px; white-space: normal; }
  }
  @media (min-width: 1100px) { :root { --side-w: 256px; } }

  /* ---------- Content ---------- */
  .content {
    min-width: 0;
    padding-inline: 16px;
    padding-block: 18px 40px;
    display: grid;
    gap: 16px;
    align-content: start;
  }
  @media (min-width: 768px) { .content { padding-inline: 24px; padding-block: 22px 48px; } }
  .page-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    line-height: 1.1;
    text-wrap: balance;
  }
  .page-meta { font-size: 13px; color: var(--muted); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    min-width: 0;
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 500;
    font-size: 13.5px;
  }
  .btn:hover { background: var(--sunken); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .field { display: grid; gap: 3px; min-width: 0; }
  .field > span {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  select, input[type="search"] {
    height: 36px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    min-width: 0;
    max-width: 100%;
  }
  select.is-set { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }

  .error {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--danger);
    color: var(--danger);
    background: var(--surface);
    font-weight: 500;
  }

  .filters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr));
    gap: 10px;
    align-items: end;
  }
  .filters .field select { width: 100%; }
  .filters .time-field select { border-color: var(--primary); }
  .filters-end { display: flex; align-items: center; gap: 10px; }
  .row-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr));
    gap: 12px;
  }
  .kpi { padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
  .kpi-label { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .kpi-value {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 32px;
    line-height: 1.15;
  }
  .kpi-sub { font-size: 12.5px; color: var(--muted); }

  .charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
    gap: 16px;
    align-items: start;
  }
  .chart-card { padding: 14px 16px 16px; display: grid; gap: 12px; align-content: start; }
  .card-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 10px; }
  .card-title {
    margin: 0 auto 0 0;
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    text-wrap: balance;
  }
  .card-note { margin: 0; font-size: 12.5px; color: var(--muted); }

  /* Donut */
  .donut-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 22px; }
  .donut { width: 184px; height: 184px; flex: none; margin-inline: auto; }
  .donut path, .donut circle.slice { cursor: pointer; }
  .donut .center-value { font-family: var(--font-display); font-weight: 600; font-size: 24px; fill: var(--text); }
  .donut .center-label { font-size: 11.5px; fill: var(--muted); }
  .legend { flex: 1 1 200px; min-width: 0; display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .legend li {
    display: grid;
    grid-template-columns: 10px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 8px;
    padding: 4px 6px;
    margin-inline: -6px;
    border-radius: 6px;
    font-size: 13.5px;
    cursor: pointer;
  }
  .legend li.is-other { cursor: default; }
  .legend li:hover, .legend li:focus-visible { background: var(--sunken); }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; }
  .legend .lg-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend .lg-val { font-family: var(--font-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .legend .lg-pct { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 5ch; text-align: right; }

  /* Columns */
  .col-box { position: relative; min-height: 250px; outline: none; border-radius: 6px; }
  .col-box:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; }
  .col-box svg { display: block; width: 100%; height: 250px; overflow: visible; }
  .col-box svg text, .donut text { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .col-box .bar { fill: var(--series); }
  .col-box .bar.is-hot { fill: var(--primary-strong); }
  .empty-note { margin: 0; padding: 28px 12px; text-align: center; color: var(--muted); font-size: 14px; }

  /* Tables */
  .table-card { display: grid; }
  .table-card .card-head { padding: 14px 16px 10px; align-items: center; }
  .table-card .card-head input { width: min(100%, 260px); }
  .table-scroll { overflow-x: auto; border-top: 1px solid var(--border); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 7px 12px; text-align: left; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
  th { background: var(--sunken); font-weight: 600; font-size: 12.5px; }
  th button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  th button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 3px; }
  th .sort-ind { color: var(--primary); font-size: 11px; min-width: 1ch; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num { font-family: var(--font-mono); font-size: 12.5px; }
  td.null { color: var(--muted); }
  th.num button { flex-direction: row-reverse; }
  .pager {
    display: flex; align-items: center; justify-content: flex-end; gap: 10px;
    padding: 10px 16px;
    font-size: 13px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  details.structure > summary {
    cursor: pointer;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 14px;
    color: var(--muted);
  }
  details.structure[open] > summary { color: var(--text); }
  .chip {
    display: inline-flex; align-items: center;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    background: var(--sunken);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .chip.t-number { color: var(--primary); border-color: currentColor; background: transparent; }
  .chip.t-date { color: var(--accent); border-color: currentColor; background: transparent; }

  .tip {
    position: fixed;
    z-index: 20;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    max-width: 260px;
    display: grid;
    gap: 2px;
  }
  .tip-value { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  .tip-value::before { content: ""; width: 12px; height: 2px; background: var(--tip-key, var(--series)); border-radius: 1px; flex: none; }
  .tip-label, .tip-sub { color: var(--muted); overflow-wrap: anywhere; }

  .drop-overlay {
    position: fixed; inset: 0; z-index: 30;
    display: grid; place-items: center;
    background: var(--series-soft);
    backdrop-filter: blur(2px);
    font-family: var(--font-display);
    font-size: 26px; font-weight: 600;
    color: var(--primary);
    border: 3px dashed var(--primary);
    pointer-events: none;
  }
  .busy { opacity: 0.55; transition: opacity 0.15s; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="shell">
  <aside class="side" aria-label="Điều hướng">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 18 18"><rect x="2" y="9" width="3" height="7" rx="1" fill="#0F5C56"/><rect x="7.5" y="5" width="3" height="11" rx="1" fill="#0F5C56"/><rect x="13" y="2" width="3" height="14" rx="1" fill="#C9860E"/></svg>
      </div>
      <h1 id="appTitle">Điều hành chất lượng</h1>
    </div>

    <nav class="nav" id="nav" aria-label="Các mục"></nav>

    <div class="source" id="dropZone">
      <span class="chip-sample" id="sampleChip" hidden>DỮ LIỆU MẪU</span>
      <div class="source-name" id="srcName"></div>
      <div class="source-meta" id="srcMeta"></div>
      <div class="source-actions">
        <button class="btn btn-primary" id="pickBtn" type="button">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2.5M4.5 6 8 2.5 11.5 6M2.5 11v2.5h11V11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Tải file lên
        </button>
        <button class="btn" id="sampleBtn" type="button" hidden>Dữ liệu mẫu</button>
      </div>
      <input type="file" id="fileInput" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls,.ods,.json" multiple hidden>
      <p class="source-hint">Mỗi trang tính (sheet) trong file thành một mục. Có thể chọn nhiều file cùng lúc. File chỉ được đọc trong trình duyệt.</p>
    </div>
  </aside>

  <main class="content" id="app">
    <div class="error" id="errorBox" role="alert" hidden></div>

    <div class="page-head">
      <h2 class="page-title" id="pageTitle"></h2>
      <span class="page-meta" id="pageMeta"></span>
    </div>

    <section class="filters" id="filters" aria-label="Bộ lọc"></section>

    <section class="kpis" id="kpis" aria-label="Chỉ số"></section>

    <section class="charts" id="charts">
      <article class="card chart-card" id="donutCard">
        <div class="card-head">
          <h3 class="card-title">Cơ cấu</h3>
          <label class="field"><span>Theo</span><select id="groupSel"></select></label>
          <label class="field"><span>Giá trị</span><select id="dMeasureSel"></select></label>
        </div>
        <div class="donut-wrap" id="donutWrap"></div>
        <p class="card-note">Nhấn vào một phần để lọc cả trang theo nhóm đó.</p>
      </article>

      <article class="card chart-card" id="colCard">
        <div class="card-head">
          <h3 class="card-title" id="colTitle">Theo thời gian</h3>
          <label class="field" id="colDimField"><span id="colDimLabel">Cột</span><select id="colDimSel"></select></label>
          <label class="field"><span>Giá trị</span><select id="cMeasureSel"></select></label>
        </div>
        <div class="col-box" id="colBox" tabindex="0" aria-label="Biểu đồ cột. Dùng phím mũi tên để xem từng cột."></div>
        <p class="card-note" id="colNote"></p>
      </article>
    </section>

    <section class="card table-card">
      <div class="card-head">
        <h3 class="card-title">Chi tiết</h3>
        <input type="search" id="searchInput" placeholder="Tìm trong bảng…" autocomplete="off" aria-label="Tìm trong bảng">
      </div>
      <div class="table-scroll">
        <table id="dataTable"><thead></thead><tbody></tbody></table>
      </div>
      <div class="pager">
        <span id="pageInfo"></span>
        <button class="btn" id="prevBtn" type="button">Trước</button>
        <button class="btn" id="nextBtn" type="button">Sau</button>
      </div>
    </section>

    <details class="card structure">
      <summary>Cấu trúc trang tính</summary>
      <div class="table-scroll">
        <table id="colsTable"><thead></thead><tbody></tbody></table>
      </div>
    </details>
  </main>
</div>

<div class="tip" id="tip" role="status" hidden></div>
<div class="drop-overlay" id="dropOverlay" hidden>Thả file để dựng dashboard</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  function jsonToAoa(data) {

    });
    return [keys].concat(data.map(function (o) {

        return v != null && typeof v === 'object' ? JSON.stringify(v) : v;

    }));
  }

  /* ---------- Column inference ---------- */
  var ID_NAME = /(^|[\s_(\/-])(mã|ma|id|code|sku|barcode|imei|serial|sđt|sdt|điện thoại|phone)([\s_)\/-]|$)/i;
  var MONEY_NAME = /(doanh|tiền|giá|thu|chi|lương|phí|vnd|amount|price|revenue|total|tổng|số lượng|qty)/i;

  function isBlank(v) { return v === null || v === undefined || v === ''; }

  function analyzeColumn(name, raw) {
    var vals = raw.filter(function (v) { return !isBlank(v); });
    var n = vals.length;
    var col = { name: name, type: 'text', empty: raw.length - n, hasTime: false };
    if (!n) { col.type = 'empty'; return { col: col, out: raw.map(function () { return null; }) }; }

    var strs = vals.filter(function (v) { return typeof v === 'string'; });
    var loc = detectNumLocale(strs);
    var order = detectDateOrder(strs);
    var numC = 0, dateC = 0;
    vals.forEach(function (v) {
      if (typeof v === 'number') numC++;
      else if (v instanceof Date) dateC++;
      else if (typeof v === 'string') {
        if (parseDate(v, order)) dateC++;

    });

    var out;
    if (numC / n >= 0.9) {
      out = raw.map(function (v) {

      });
      var nums = out.filter(function (v) { return v != null; });
      var allInt = nums.every(Number.isInteger);
      var leadZero = strs.some(function (s) { return /^0\d/.test(s); });
      var distinct = new Set(nums).size;
      var barcodeLike = strs.length === n && strs.every(function (s) { return /^\d{8,}$/.test(s); }) &&
                        distinct > n * 0.9 && !MONEY_NAME.test(name);
      if (allInt && (leadZero || barcodeLike || (ID_NAME.test(name) && !MONEY_NAME.test(name)))) {
        col.type = 'id';
        out = raw.map(function (v) { return isBlank(v) ? null : String(v); });
      } else {
        col.type = 'number';
        var sum = 0, cnt = 0, mn = Infinity, mx = -Infinity;
        nums.forEach(function (x) { sum += x; cnt++; if (x < mn) mn = x; if (x > mx) mx = x; });
        col.sum = sum; col.count = cnt; col.min = mn; col.max = mx;

      col.type = 'date';
      out = raw.map(function (v) {
        if (isBlank(v)) return null;
        if (v instanceof Date) return new Date(Math.round(v.getTime() / 60000) * 60000);
        if (typeof v === 'string') return parseDate(v, order);

      out.forEach(function (d) {

    var set = new Set();
    out.forEach(function (v) { if (v != null) set.add(keyOf(v)); });
    col.distinct = set.size;
    if (col.type === 'text') {
      if (ID_NAME.test(name) && col.distinct === n) col.type = 'id';
      else col.type = (col.distinct <= 60 && (col.distinct <= n * 0.6 || n <= 12)) ? 'category' : 'text';
    }

  }

  function buildTable(aoa) {
    aoa = aoa.map(function (r) {
      return (r || []).map(function (v) { return typeof v === 'string' ? v.trim() : v; });
    }).filter(function (r) { return r.some(function (v) { return !isBlank(v); }); });
    if (!aoa.length) throw new Error('File không có dữ liệu.');

    var nonEmpty = function (r) { return r.filter(function (v) { return !isBlank(v); }).length; };
    var head = aoa.slice(0, 10);
    var maxNE = head.reduce(function (m, r) { return Math.max(m, nonEmpty(r)); }, 0);
    var h = head.findIndex(function (r) { return nonEmpty(r) >= Math.max(1, maxNE * 0.6); });
    var width = aoa.reduce(function (m, r) { return Math.max(m, r.length); }, 0);

    var seen = {};
    var names = [];
    for (var j = 0; j < width; j++) {
      var nm = aoa[h][j];
      nm = isBlank(nm) ? 'Cột ' + (j + 1) : (nm instanceof Date ? fmtDate(nm) : String(nm));
      if (seen[nm]) { seen[nm]++; nm = nm + ' (' + seen[nm] + ')'; } else seen[nm] = 1;
      names.push(nm);

    if (!body.length) throw new Error('File chỉ có dòng tiêu đề, chưa có dòng dữ liệu nào.');

  /* ---------- App state ---------- */
  var PAGES = [];       // [{ name, table, st, values }]
  var CUR = 0;
  var PAGE_SIZE = 25;
  var AVG_NAME = /(ngày|giờ|phút|thời gian|tỷ lệ|tỉ lệ|%|tuổi|điểm|đánh giá|rate|avg|trung bình)/i;
  var SLOT = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)', 'var(--c5)', 'var(--c6)'];
  var OTHER = 'var(--c-other)';

  function cur() { return PAGES[CUR]; }
  function colsOfType(t, type) {
    var out = [];
    t.columns.forEach(function (c, j) { if (c.type === type) out.push(j); });
    return out;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function truncate(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

  function initState(t) {
    var cats = colsOfType(t, 'category').filter(function (j) { return t.columns[j].distinct >= 2; });
    var byDistinct = cats.slice().sort(function (a, b) { return t.columns[a].distinct - t.columns[b].distinct || a - b; });
    var filterCols = byDistinct.slice(0, 6).sort(function (a, b) { return a - b; });
    var nums = colsOfType(t, 'number');
    var dates = colsOfType(t, 'date');
    var hasId = colsOfType(t, 'id').length > 0;
    var sumNums = nums.filter(function (j) { return !AVG_NAME.test(t.columns[j].name); });
    var def = (hasId || !sumNums.length) ? 'count' : 'sum:' + sumNums[0];
    return {
      filters: {}, preset: 'all', q: '',

      group: byDistinct.length ? byDistinct[0] : -1,
      dMeasure: def, cMeasure: def,
      time: dates.length ? dates[0] : -1,
      cDim: dates.length ? -1 : (byDistinct.length > 1 ? byDistinct[1] : (byDistinct.length ? byDistinct[0] : -1)),
      sortCol: -1, sortDir: 1, page: 0,

  }

  function measureInfo(t, key) {

    var p = key.split(':'), j = +p[1];

  }
  function measureOptions(t, withAvg) {

  function filteredRows() {
    var p = cur(), t = p.table, st = p.st, rows = t.rows;
    if (st.time >= 0 && st.preset !== 'all') {

      var start = end - (+st.preset) * DAY, tc = st.time;

  function syncFilters() {

  /* ---------- Donut ---------- */
  function renderDonut(rows) {
    var p = cur(), t = p.table, st = p.st;

    wrap.textContent = '';
    var m = measureInfo(t, st.dMeasure);
    var groups = new Map();
    rows.forEach(function (r) {
      var k = keyOf(r.v[st.group]);
      var a = groups.get(k); if (!a) { a = newAgg(); groups.set(k, a); }

    });
    var items = Array.from(groups.entries()).map(function (e) {
      return { key: e[0], label: labelOf(e[0]), agg: e[1], value: aggValue(e[1], m) };
    }).filter(function (it) { return it.value > 0; })
      .sort(function (a, b) { return b.value - a.value; });
    if (items.length > 6) {
      var rest = items.slice(5), merged = newAgg();
      rest.forEach(function (it) { merged.c += it.agg.c; merged.s += it.agg.s; merged.n += it.agg.n; });
      items = items.slice(0, 5).concat([{ key: null, label: 'Khác (' + rest.length + ' nhóm)', agg: merged, value: aggValue(merged, m) }]);
    }
    if (!items.length) {

    items.forEach(function (it, i) { it.color = it.key === null ? OTHER : SLOT[i]; });
    var total = items.reduce(function (s, it) { return s + it.value; }, 0);
    var groupName = t.columns[st.group].name;

    var C = 92, R = 88, R0 = 58, s = '<svg class="donut" viewBox="0 0 184 184" role="img" aria-label="Biểu đồ cơ cấu">';
    if (items.length === 1) {
      s += '<circle class="slice" data-i="0" cx="' + C + '" cy="' + C + '" r="' + ((R + R0) / 2) + '" fill="none" stroke="' + items[0].color + '" stroke-width="' + (R - R0) + '"/>';
    } else {
      var a0 = -Math.PI / 2;
      items.forEach(function (it, i) {
        var a1 = a0 + 2 * Math.PI * it.value / total;
        var large = a1 - a0 > Math.PI ? 1 : 0;
        var pt = function (r, a) { return (C + r * Math.cos(a)).toFixed(2) + ' ' + (C + r * Math.sin(a)).toFixed(2); };
        s += '<path data-i="' + i + '" d="M' + pt(R, a0) + 'A' + R + ' ' + R + ' 0 ' + large + ' 1 ' + pt(R, a1) +
             'L' + pt(R0, a1) + 'A' + R0 + ' ' + R0 + ' 0 ' + large + ' 0 ' + pt(R0, a0) + 'Z" fill="' + it.color +
             '" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>';

    s += '<text class="center-value" x="' + C + '" y="' + (C + 2) + '" text-anchor="middle">' + esc(fmtCompact(total)) + '</text>';
    s += '<text class="center-label" x="' + C + '" y="' + (C + 20) + '" text-anchor="middle">' + (m.kind === 'count' ? 'bản ghi' : 'tổng') + '</text>';
    s += '</svg>';

    wrap.appendChild(svg);

    var ul = document.createElement('ul'); ul.className = 'legend';
    items.forEach(function (it, i) {

      li.dataset.i = i;
      if (it.key === null) li.className = 'is-other';
      var sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = it.color;
      var lb = document.createElement('span'); lb.className = 'lg-label'; lb.textContent = it.label; lb.title = it.label;
      var vl = document.createElement('span'); vl.className = 'lg-val'; vl.textContent = fmtCompact(it.value);
      var pc = document.createElement('span'); pc.className = 'lg-pct'; pc.textContent = nf.format(Math.round(it.value / total * 1000) / 10) + '%';
      li.appendChild(sw); li.appendChild(lb); li.appendChild(vl); li.appendChild(pc);
      ul.appendChild(li);
    });
    wrap.appendChild(ul);

    var slices = svg.querySelectorAll('[data-i]');
    var hot = function (i) {
      Array.prototype.forEach.call(slices, function (el) { el.style.opacity = i == null || +el.dataset.i === i ? '' : '0.4'; });
    };
    var show = function (i, x, y) {
      var it = items[i];
      hot(i);
      showTip(x, y, fmtNum(it.value) + ' · ' + nf.format(Math.round(it.value / total * 1000) / 10) + '%', groupName + ': ' + it.label, m.label, it.color);
    };
    var leave = function () { hot(null); hideTip(); };
    var click = function (i) { var it = items[i]; if (it.key !== null) { hideTip(); setFilter(st.group, it.key); } };
    Array.prototype.forEach.call(slices, function (el) {
      var i = +el.dataset.i;

      var i = +li.dataset.i;

      li.addEventListener('blur', leave);

      li.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); click(i); } });
    });
  }

  /* ---------- Column chart ---------- */
  function niceTicks(lo, hi, count) {
    if (lo === hi) { hi = lo === 0 ? 1 : lo + Math.abs(lo); }
    var raw = (hi - lo) / count;
    var pw = Math.pow(10, Math.floor(Math.log10(raw)));
    var r = raw / pw;
    var step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * pw;
    var start = Math.floor(lo / step) * step, end = Math.ceil(hi / step) * step;
    var ticks = [];
    for (var v = start; v <= end + step / 2; v += step) ticks.push(Math.round(v / step) * step);
    return ticks;
  }
  function bucketOf(d, g) {
    if (g === 'hour') return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours());
    if (g === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (g === 'week') return new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
    if (g === 'month') return new Date(d.getFullYear(), d.getMonth(), 1);
    return new Date(d.getFullYear(), 0, 1);
  }
  function nextBucket(d, g) {
    if (g === 'hour') return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1);
    if (g === 'day') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
    if (g === 'week') return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7);
    if (g === 'month') return new Date(d.getFullYear(), d.getMonth() + 1, 1);
    return new Date(d.getFullYear() + 1, 0, 1);
  }
  function bucketLabel(d, g, long) {
    if (g === 'hour') return pad(d.getHours()) + ':00' + (long ? ' ' + fmtDate(d) : '');
    if (g === 'day') return long ? fmtDate(d) : pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
    if (g === 'week') return long ? 'Tuần từ ' + fmtDate(d) : pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
    if (g === 'month') return (long ? 'Tháng ' : '') + pad(d.getMonth() + 1) + '/' + d.getFullYear();
    return (long ? 'Năm ' : '') + d.getFullYear();
  }
  var GRAN_NAME = { hour: 'theo giờ', day: 'theo ngày', week: 'theo tuần', month: 'theo tháng', year: 'theo năm' };

  var colModel = null;

  function renderCols(rows) {
    var p = cur(), t = p.table, st = p.st;
    var box = $('colBox');
    var m = measureInfo(t, st.cMeasure);
    var pts = [];
    if (st.time >= 0) {
      var col = t.columns[st.time];
      var t0 = Infinity, t1 = -Infinity;
      rows.forEach(function (r) { var d = r.v[st.time]; if (d) { var x = d.getTime(); if (x < t0) t0 = x; if (x > t1) t1 = x; } });
      if (t0 !== Infinity) {
        var span = (t1 - t0) / DAY;
        var g = span <= 2 && col.hasTime ? 'hour' : span <= 45 ? 'day' : span <= 210 ? 'week' : span <= 3653 ? 'month' : 'year';
        var agg = new Map();
        rows.forEach(function (r) {
          var d = r.v[st.time]; if (!d) return;
          var k = bucketOf(d, g).getTime();
          var a = agg.get(k); if (!a) { a = newAgg(); agg.set(k, a); }
          addAgg(a, r, m);
        });
        for (var b = bucketOf(new Date(t0), g); b.getTime() <= t1 && pts.length < 3000; b = nextBucket(b, g)) {
          var a = agg.get(b.getTime());
          pts.push({ label: bucketLabel(b, g, false), long: bucketLabel(b, g, true), v: a ? aggValue(a, m) : (m.kind === 'avg' ? null : 0), key: null });
        }
        $('colNote').textContent = m.label + ' ' + GRAN_NAME[g] + ', ' + fmtNum(pts.length) + ' cột.' +
          (g === 'week' || g === 'month' ? ' Cột đầu và cuối có thể chưa đủ kỳ.' : '');
      }
    } else if (st.cDim >= 0) {
      var groups = new Map();
      rows.forEach(function (r) {
        var k = keyOf(r.v[st.cDim]);
        var a2 = groups.get(k); if (!a2) { a2 = newAgg(); groups.set(k, a2); }
        addAgg(a2, r, m);
      });
      var items = Array.from(groups.entries()).map(function (e) {
        return { key: e[0], label: labelOf(e[0]), long: t.columns[st.cDim].name + ': ' + labelOf(e[0]), agg: e[1], v: aggValue(e[1], m) };
      }).filter(function (it) { return it.v != null; }).sort(function (x, y) { return y.v - x.v; });
      if (items.length > 13) {
        var rest = items.slice(12), merged = newAgg();
        rest.forEach(function (it) { merged.c += it.agg.c; merged.s += it.agg.s; merged.n += it.agg.n; });
        items = items.slice(0, 12).concat([{ key: null, label: 'Khác', long: 'Khác (' + rest.length + ' nhóm)', agg: merged, v: aggValue(merged, m) }]);
      }
      pts = items;
      $('colNote').textContent = m.label + '. Nhấn vào một cột để lọc theo nhóm đó.';
    }
    if (!pts.length) {
      colModel = null;
      box.textContent = '';
      var e0 = document.createElement('p'); e0.className = 'empty-note';
      e0.textContent = 'Không có dòng nào khớp bộ lọc.';
      box.appendChild(e0);
      $('colNote').textContent = '';
      return;
    }
    colModel = { pts: pts, m: m, idx: pts.length - 1, cat: st.time < 0, dim: st.cDim };
    drawColumns();
  }

  function barPath(x, y, w, h, r, up) {
    r = Math.min(r, w / 2, h);
    if (r <= 0) return 'M' + x + ' ' + y + 'h' + w + 'v' + h + 'h' + (-w) + 'Z';
    if (up) {
      return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
             'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + h) + 'Z';
    }
    return 'M' + x + ' ' + y + 'V' + (y + h - r) + 'Q' + x + ' ' + (y + h) + ' ' + (x + r) + ' ' + (y + h) +
           'H' + (x + w - r) + 'Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w) + ' ' + (y + h - r) + 'V' + y + 'Z';
  }

  function drawColumns() {
    var box = $('colBox');
    if (!colModel) return;
    var pts = colModel.pts, n = pts.length;
    var W = Math.max(260, box.clientWidth || 600), H = 250;
    var vals = pts.map(function (q) { return q.v; }).filter(function (v) { return v != null; });
    var lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
    var ticks = niceTicks(lo, hi, 4);
    var y0 = ticks[0], y1 = ticks[ticks.length - 1];
    var labW = ticks.reduce(function (mx, t) { return Math.max(mx, fmtCompact(t).length); }, 0) * 6.6 + 10;
    var M = { l: labW, r: 4, t: 10, b: 30 };
    var pw = W - M.l - M.r, ph = H - M.t - M.b;
    var band = pw / n;
    var gap = band >= 6 ? Math.max(2, band * 0.22) : (band >= 3 ? 1 : 0);
    var bw = Math.max(1, band - gap);
    var y = function (v) { return M.t + ph - (v - y0) / (y1 - y0) * ph; };
    var zero = y(Math.max(y0, Math.min(0, y1)));
    colModel.W = W; colModel.M = M; colModel.band = band;

    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img">';
    ticks.forEach(function (t) {
      var yy = y(t).toFixed(1);
      s += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (t === 0 ? 'var(--axis)' : 'var(--grid)') + '" stroke-width="1"/>';
      s += '<text x="' + (M.l - 8) + '" y="' + yy + '" dy="0.35em" text-anchor="end">' + esc(fmtCompact(t)) + '</text>';
    });
    pts.forEach(function (q, i) {
      if (q.v == null) return;
      var x = M.l + i * band + gap / 2;
      var yv = y(q.v);
      var top = Math.min(yv, zero), h = Math.max(1, Math.abs(yv - zero));
      var fill = q.key === null && colModel.cat ? ' style="fill: var(--c-other)"' : '';
      s += '<path class="bar" data-i="' + i + '"' + fill + ' d="' + barPath(+x.toFixed(2), +top.toFixed(2), +bw.toFixed(2), +h.toFixed(2), bw >= 8 ? 4 : 0, q.v >= 0) + '"/>';
    });
    var maxLabels = Math.max(2, Math.floor(pw / (colModel.cat ? 76 : 54)));
    var step = Math.ceil(n / maxLabels);
    for (var i = 0; i < n; i += step) {

      var anchor = 'middle';

      s += '<text x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="' + anchor + '">' + esc(truncate(pts[i].label, colModel.cat ? 11 : 14)) + '</text>';
    }

  }

  /* ---------- Tables ---------- */
  function compare(a, b) {
    if (a == null && b == null) return 0;
    if (a == null) return 1;

    return String(a).localeCompare(String(b), 'vi', { numeric: true });
  }

  function renderTable(rows) {
    var p = cur(), t = p.table, st = p.st;
    var table = $('dataTable'), thead = table.tHead, tbody = table.tBodies[0];
    thead.textContent = ''; tbody.textContent = '';
    var tr = document.createElement('tr');
    t.columns.forEach(function (c, j) {
      var th = document.createElement('th');
      if (c.type === 'number') th.className = 'num';
      var btn = document.createElement('button'); btn.type = 'button';
      var nm = document.createElement('span'); nm.textContent = c.name;
      var ind = document.createElement('span'); ind.className = 'sort-ind';
      ind.textContent = st.sortCol === j ? (st.sortDir > 0 ? '▲' : '▼') : '';
      btn.appendChild(nm); btn.appendChild(ind);
      th.setAttribute('aria-sort', st.sortCol === j ? (st.sortDir > 0 ? 'ascending' : 'descending') : 'none');
      btn.addEventListener('click', function () {
        if (st.sortCol === j) { if (st.sortDir > 0) st.sortDir = -1; else st.sortCol = -1; }
        else { st.sortCol = j; st.sortDir = c.type === 'number' || c.type === 'date' ? -1 : 1; }
        st.page = 0;
        renderTable(filteredRows());
      });
      th.appendChild(btn);

    });
    thead.appendChild(tr);

    var list = rows;
    if (st.sortCol >= 0) {
      var sc = st.sortCol, dir = st.sortDir;
      list = rows.slice().sort(function (a, b) {

        if (va == null || vb == null) return compare(va, vb);
        return dir * compare(va, vb);
      });
    }
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (st.page >= pages) st.page = pages - 1;
    var slice = list.slice(st.page * PAGE_SIZE, st.page * PAGE_SIZE + PAGE_SIZE);
    var frag = document.createDocumentFragment();
    slice.forEach(function (r) {
      var row = document.createElement('tr');
      r.v.forEach(function (v, j) {
        var td = document.createElement('td'), c = t.columns[j];
        if (c.type === 'number') td.className = 'num';
        if (v == null) { td.className += ' null'; td.textContent = '–'; }
        else { td.textContent = fmtCell(v, c); if (c.type === 'text') td.title = td.textContent; }
        row.appendChild(td);

    if (!slice.length) {

    tbody.appendChild(frag);
    var from = list.length ? st.page * PAGE_SIZE + 1 : 0;
    $('pageInfo').textContent = fmtNum(from) + '–' + fmtNum(st.page * PAGE_SIZE + slice.length) + ' / ' + fmtNum(list.length) + ' dòng';
    $('prevBtn').disabled = st.page === 0;
    $('nextBtn').disabled = st.page >= pages - 1;
  }

  var TYPE_NAME = { number: 'Số', date: 'Ngày giờ', category: 'Nhóm', text: 'Văn bản', id: 'Mã định danh' };
  function renderStructure() {
    var t = cur().table;
    var table = $('colsTable'), thead = table.tHead, tbody = table.tBodies[0];
    thead.textContent = ''; tbody.textContent = '';
    var hr = document.createElement('tr');
    [['Cột', ''], ['Kiểu', ''], ['Giá trị khác nhau', 'num'], ['Ô trống', 'num'], ['Ghi chú', '']].forEach(function (h) {
      var th = document.createElement('th'); th.textContent = h[0]; th.className = h[1]; hr.appendChild(th);
    });
    thead.appendChild(hr);
    t.columns.forEach(function (c) {
      var tr = document.createElement('tr');
      var note = '';
      if (c.type === 'number') note = 'Từ ' + fmtNum(c.min) + ' đến ' + fmtNum(c.max);
      else if (c.type === 'date') note = fmtDate(c.min, c.hasTime) + ' – ' + fmtDate(c.max, c.hasTime);
      else if (c.type === 'category') note = 'Dùng để lọc và chia nhóm';
      [c.name, null, fmtNum(c.distinct), fmtNum(c.empty), note].forEach(function (v, k) {
        var td = document.createElement('td');
        if (k === 1) {
          var chip = document.createElement('span');
          chip.className = 'chip t-' + c.type;
          chip.textContent = TYPE_NAME[c.type];
          td.appendChild(chip);
        } else td.textContent = v;
        if (k === 2 || k === 3) td.className = 'num';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  /* ---------- Loading ---------- */
  function showError(msg) {
    var e = $('errorBox');
    e.textContent = msg || '';
    e.hidden = !msg;
  }

  function setPages(pages, srcName, isSample) {
    var seen = {};
    pages.forEach(function (p) {
      if (seen[p.name]) { seen[p.name]++; p.name = p.name + ' (' + seen[p.name] + ')'; } else seen[p.name] = 1;
      p.st = initState(p.table);
      p.values = {};
    });
    PAGES = pages;
    CUR = 0;
    var total = pages.reduce(function (s, p) { return s + p.table.rows.length; }, 0);
    $('srcName').textContent = srcName;
    $('srcMeta').textContent = pages.length + ' mục · ' + fmtNum(total) + ' dòng' + (isSample ? ' · số liệu minh họa' : '');
    $('sampleChip').hidden = !isSample;
    $('sampleBtn').hidden = !!isSample;
    renderNav();
    renderPage();
  }

  function baseName(n) { return n.replace(/\.[^.]+$/, ''); }

  function readFilePages(file) {
    var name = file.name, lower = name.toLowerCase();
    if (/\.(csv|tsv|txt)$/.test(lower)) {
      return file.arrayBuffer().then(function (buf) {
        var text;
        try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
        catch (e) { text = new TextDecoder('windows-1258').decode(buf); }
        return { pages: [{ name: baseName(name), file: name, table: buildTable(parseCSV(text)) }], errors: [] };
      });
    }
    if (/\.json$/.test(lower)) {
      return file.text().then(function (text) {
        return { pages: [{ name: baseName(name), file: name, table: buildTable(jsonToAoa(JSON.parse(text))) }], errors: [] };
      });
    }
    if (/\.(xlsx|xlsm|xls|ods)$/.test(lower)) {
      if (typeof XLSX === 'undefined') {
        return Promise.reject(new Error('chưa tải được thư viện đọc Excel (cần mạng). Kiểm tra kết nối rồi tải lại trang, hoặc lưu file thành CSV'));
      }
      return file.arrayBuffer().then(function (buf) {
        var wb = XLSX.read(buf, { type: 'array', cellDates: true });
        var pages = [], errors = [];
        wb.SheetNames.forEach(function (sn) {
          var ws = wb.Sheets[sn];
          if (!ws['!ref']) return;
          try {
            var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
            pages.push({ name: sn, file: name, table: buildTable(aoa) });
          } catch (err) {
            errors.push('sheet “' + sn + '” trong ' + name + ' (' + err.message + ')');
          }
        });
        return { pages: pages, errors: errors };
      });
    }
    return Promise.reject(new Error('đuôi file chưa được hỗ trợ'));
  }

  function loadFiles(list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    showError('');
    $('app').classList.add('busy');
    Promise.all(files.map(function (f) {
      return readFilePages(f).catch(function (err) {
        return { pages: [], errors: ['“' + f.name + '”: ' + (err && err.message ? err.message : 'không đọc được')] };
      });
    })).then(function (results) {
      var pages = [], errors = [];
      results.forEach(function (r) { pages = pages.concat(r.pages); errors = errors.concat(r.errors); });
      $('app').classList.remove('busy');
      if (!pages.length) {
        showError('Không dựng được dashboard. ' + errors.join('; ') + '. Hãy thử file CSV, Excel hoặc JSON có dòng tiêu đề.');
        return;
      }
      setPages(pages, files.length === 1 ? files[0].name : files.length + ' file', false);
      if (errors.length) showError('Đã bỏ qua: ' + errors.join('; ') + '.');
    });
  }

  /* ---------- Sample data (clearly marked) ---------- */
  function samplePages() {
    var seed = 20261003;
    var rnd = function () { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
    var pick = function (arr) { return arr[Math.floor(rnd() * arr.length)]; };
    var weighted = function (arr) {
      var tot = arr.reduce(function (s, x) { return s + x[1]; }, 0), r = rnd() * tot, acc = 0;
      for (var i = 0; i < arr.length; i++) { acc += arr[i][1]; if (r <= acc) return arr[i][0]; }
      return arr[arr.length - 1][0];
    };
    var units = [['Hoàn Kiếm', 1.0], ['Cầu Giấy', 1.3], ['Đống Đa', 1.4], ['Hai Bà Trưng', 1.1], ['Long Biên', 0.8], ['Hà Đông', 1.2]];
    var services = [['Chuyển phát nhanh', 4], ['Bưu kiện', 3], ['TMĐT thu hộ', 5], ['Thư thường', 1.5]];
    var END = new Date(2026, 8, 30);
    var dayStr = function (d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
    var dtStr = function (d) { return dayStr(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
    var daysAgo = function (n, h) { return new Date(END.getFullYear(), END.getMonth(), END.getDate() - n, h || 0, Math.floor(rnd() * 60)); };
    var digits = function (n) { var s = ''; while (s.length < n) s += Math.floor(rnd() * 10); return s; };

    var tq = [['Ngày', 'Bưu cục', 'Sản lượng phát', 'Phát thành công', 'Tồn phát', 'Sản lượng thu', 'Thu thành công', 'Tồn thu']];
    for (var d = 59; d >= 0; d--) {
      units.forEach(function (u) {
        var sp = Math.round(420 * u[1] * (0.85 + rnd() * 0.3) * (1 + (59 - d) * 0.003));
        var ptc = Math.round(sp * (0.88 + rnd() * 0.09));
        var st = Math.round(230 * u[1] * (0.85 + rnd() * 0.3));
        var ttc = Math.round(st * (0.9 + rnd() * 0.08));
        tq.push([dayStr(daysAgo(d)), u[0], sp, ptc, sp - ptc, st, ttc, st - ttc]);
      });
    }

    var reasonsP = [['Không liên lạc được người nhận', 5], ['Người nhận hẹn phát lại', 4], ['Sai, thiếu địa chỉ', 2], ['Người nhận vắng nhà', 3], ['Thiếu nhân lực tuyến phát', 1.5]];
    var tp = [['Mã bưu gửi', 'Ngày nhận', 'Bưu cục phát', 'Dịch vụ', 'Lý do tồn', 'Số ngày tồn', 'Cước (đ)']];
    for (var i = 0; i < 268; i++) {
      var age = Math.min(13, Math.floor(-Math.log(1 - rnd() * 0.999) * 2.4)) + 1;
      var svc = weighted(services);
      tp.push(['EB' + digits(9) + 'VN', dtStr(daysAgo(age, 7 + Math.floor(rnd() * 11))), weighted(units), svc, weighted(reasonsP), age,
        Math.round((svc === 'Thư thường' ? 9000 : 18000 + rnd() * 52000) / 500) * 500]);
    }

    var reasonsT = [['Khách chưa chuẩn bị hàng', 5], ['Khách hẹn lại giờ lấy', 3], ['Quá tải tuyến thu', 2], ['Sai địa chỉ lấy hàng', 1.2]];
    var custs = [['Shop TMĐT', 6], ['Doanh nghiệp', 3], ['Cá nhân', 2]];
    var tt = [['Mã yêu cầu', 'Ngày yêu cầu', 'Bưu cục thu', 'Nhóm khách hàng', 'Lý do tồn', 'Số ngày tồn']];
    for (var k = 0; k < 154; k++) {
      var age2 = Math.min(9, Math.floor(-Math.log(1 - rnd() * 0.999) * 1.6)) + 1;
      tt.push(['YC' + digits(7), dtStr(daysAgo(age2, 8 + Math.floor(rnd() * 9))), weighted(units), weighted(custs), weighted(reasonsT), age2]);
    }

    var tc = [['Mã bưu gửi', 'Loại', 'Thời điểm hoàn thành', 'Bưu cục', 'Dịch vụ', 'Thời gian xử lý (giờ)', 'Đúng chỉ tiêu']];
    for (var q = 0; q < 620; q++) {
      var kind = rnd() < 0.62 ? 'Phát' : 'Thu';
      var hours = Math.round((2 + -Math.log(1 - rnd() * 0.999) * (kind === 'Phát' ? 14 : 8)) * 10) / 10;
      tc.push([kind === 'Phát' ? 'EB' + digits(9) + 'VN' : 'YC' + digits(7), kind, dtStr(daysAgo(Math.floor(rnd() * 30), 7 + Math.floor(rnd() * 12))),
        weighted(units), weighted(services), hours, hours <= (kind === 'Phát' ? 24 : 12) ? 'Đạt' : 'Không đạt']);
    }

    return [
      { name: 'Tổng quan', table: buildTable(tq) },
      { name: 'Tồn phát', table: buildTable(tp) },
      { name: 'Tồn thu', table: buildTable(tt) },
      { name: 'Thu/phát thành công', table: buildTable(tc) }
    ];
  }
  function loadSample() {
    showError('');
    setPages(samplePages(), 'Bộ dữ liệu mẫu: bưu chính, 6 bưu cục', true);
  }

  /* ---------- Events ---------- */
  $('pickBtn').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (e) { loadFiles(e.target.files); e.target.value = ''; });
  $('sampleBtn').addEventListener('click', loadSample);

  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') < 0) return;
    dragDepth++; $('dropOverlay').hidden = false;
  });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) $('dropOverlay').hidden = true;
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    dragDepth = 0; $('dropOverlay').hidden = true;
    if (e.dataTransfer && e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
  });

  $('groupSel').addEventListener('change', function (e) { cur().st.group = +e.target.value; renderData(); });
  $('dMeasureSel').addEventListener('change', function (e) { cur().st.dMeasure = e.target.value; renderData(); });
  $('cMeasureSel').addEventListener('change', function (e) { cur().st.cMeasure = e.target.value; renderData(); });
  $('colDimSel').addEventListener('change', function (e) {
    var st = cur().st;
    if (st.time >= 0) st.time = +e.target.value; else st.cDim = +e.target.value;
    renderData();
  });
  var qTimer = null;
  $('searchInput').addEventListener('input', function (e) {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { var st = cur().st; st.q = e.target.value.trim(); st.page = 0; renderData(); }, 150);
  });
  $('prevBtn').addEventListener('click', function () { cur().st.page--; renderTable(filteredRows()); });
  $('nextBtn').addEventListener('click', function () { cur().st.page++; renderTable(filteredRows()); });

  $('colBox').addEventListener('keydown', function (e) {
    if (!colModel) return;
    var n = colModel.pts.length, i = colModel.idx;
    if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
    else if (e.key === 'ArrowRight') i = Math.min(n - 1, i + 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = n - 1;
    else if ((e.key === 'Enter' || e.key === ' ') && colModel.cat && colModel.pts[i].key !== null) {
      e.preventDefault(); hideTip(); setFilter(colModel.dim, colModel.pts[i].key); return;
    } else return;
    e.preventDefault();
    focusCol(i);
  });
  $('colBox').addEventListener('focus', function () { if (colModel) focusCol(colModel.idx); });
  $('colBox').addEventListener('blur', clearCol);

  if (window.ResizeObserver) {
    var lastW = 0;
    new ResizeObserver(function (entries) {
      var w = Math.round(entries[0].contentRect.width);
      if (w && w !== lastW) { lastW = w; drawColumns(); }
    }).observe($('colBox'));
  }

  loadSample();
})();
</script>
